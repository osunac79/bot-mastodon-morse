name: Quiz de morse (tarde)

on:
  schedule:
    # 18:00 hora de Madrid = 16:00 UTC en verano, 17:00 en invierno.
    # El control horario se hace contra Europa/Madrid para no depender
    # solo del desfase fijo entre UTC y Madrid.
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar hora local (Europa/Madrid)
        id: hora
        run: echo "hora=$(TZ=Europe/Madrid date +%H)" >> "$GITHUB_OUTPUT"

      - name: Publicar quiz
        if: ${{ (steps.hora.outputs.hora >= 16 && steps.hora.outputs.hora < 19) }}
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python scripts/quiz.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "morse-bot"
          git config user.email "morse-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Actualizar estado tras el quiz"
          git pull --rebase origin ${{ github.ref }}
          git push origin HEAD:${{ github.ref }}
