name: Revisar menciones del quiz

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar menciones
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python scripts/revisar_menciones.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "morse-bot"
          git config user.email "morse-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Actualizar ranking tras revisar menciones"
          git pull --rebase origin ${{ github.ref }}
          git push origin HEAD:${{ github.ref }}
