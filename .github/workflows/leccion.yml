name: Lección de morse (mañana)

on:
  schedule:
    # 09:00 hora de Madrid = 07:00 UTC en horario de verano, 08:00 en invierno.
    # Ajusta esta hora si notas desfase estacional.
    - cron: "0 7 * * *"
  workflow_dispatch: {}   # te permite lanzarlo manualmente desde GitHub

jobs:
  leccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar lección
        env:
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/leccion.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "morse-bot"
          git config user.email "morse-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Actualizar estado tras la lección"
          git push
